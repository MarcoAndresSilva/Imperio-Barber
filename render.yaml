# Blueprint de Render para el backend de Imperio Barber.
# La base de datos es Neon (no se declara acá); Render solo corre la API NestJS.
#
# Env vars con `sync: false` se pegan a mano en el dashboard de Render al crear el
# servicio (no se commiten valores reales):
#   DATABASE_URL          Neon, connection string "pooled"  (runtime)
#   DIRECT_URL            Neon, connection string directa    (migraciones)
#   FRONTEND_URL          URL del sitio en Netlify           (CORS)
#   ADMIN_EMAIL / ADMIN_PASSWORD / ADMIN_NAME                (cuenta del panel; las usa seed:admin)
#   CLOUDINARY_CLOUD_NAME / CLOUDINARY_API_KEY / CLOUDINARY_API_SECRET  (firma de subida de fotos)
services:
  - type: web
    name: imperio-barber-api
    runtime: node
    plan: free             # demo: se acepta el cold start (~50s tras 15 min inactivo)
    rootDir: backend
    region: ohio          # misma zona que Neon (us-east-2) -> menor latencia DB
    # --include=dev: con NODE_ENV=production, `npm ci` omitiría prisma / nest / tsx /
    # typescript / dotenv, que el build y la migración necesitan.
    # El plan free no tiene preDeployCommand, así que `migrate deploy` va al final del build.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: node dist/src/main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: BOOKING_PENDING_TTL_MINUTES
        value: "25"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
