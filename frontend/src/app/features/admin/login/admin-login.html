<div class="admin-login">
  <div class="card">
    <app-logo variant="badge" class="logo" />
    <h1>Panel de administración</h1>
    <p class="lead">Ingresa con tu cuenta para gestionar reservas, barberos y servicios.</p>

    <form (submit)="$event.preventDefault(); onSubmit()">
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          placeholder="dueno@imperiobarber.cl"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
        />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
        />
      </div>

      @if (error()) {
        <p class="error-msg">{{ error() }}</p>
      }

      <button type="submit" class="btn btn-solid btn-block" [disabled]="!canSubmit || submitting()">
        {{ submitting() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
