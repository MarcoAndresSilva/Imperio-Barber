@if (variant() === 'badge') {
  <svg class="badge" viewBox="0 0 200 200" role="img" aria-label="Imperio Barber">
    <circle cx="100" cy="100" r="98" class="badge-bg" />
    <circle cx="100" cy="100" r="98" class="badge-ring" fill="none" />
    <text x="100" y="46" class="badge-est" text-anchor="middle">EST. 2022</text>
    <g class="badge-column" transform="translate(100,72)">
      <rect x="-16" y="0" width="32" height="6" />
      <rect x="-12" y="6" width="24" height="34" fill="none" class="column-shaft" />
      <line x1="-9" y1="10" x2="-9" y2="36" />
      <line x1="-3" y1="10" x2="-3" y2="36" />
      <line x1="3" y1="10" x2="3" y2="36" />
      <line x1="9" y1="10" x2="9" y2="36" />
      <rect x="-16" y="40" width="32" height="6" />
    </g>
    <text x="100" y="140" class="badge-title" text-anchor="middle">IMPERIO</text>
    <line x1="42" y1="150" x2="158" y2="150" class="badge-divider" />
    <text x="100" y="166" class="badge-subtitle" text-anchor="middle">BARBER FOR MEN</text>
  </svg>
} @else {
  <span class="wordmark">
    IMPERIO <span class="wordmark-accent">BARBER</span>
  </span>
}
