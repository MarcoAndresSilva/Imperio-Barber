<header [class.scrolled]="scrolled()">
  <div class="container bar">
    <a href="#top" class="brand"><app-logo /></a>
    <nav>
      <ul>
        <li><a href="#servicios">Servicios</a></li>
        <li><a href="#nosotros">Nosotros</a></li>
        <li><a href="#info">Horario</a></li>
      </ul>
    </nav>
    <div class="nav-cta">
      <a [href]="whatsappUrl" target="_blank" rel="noopener" class="btn btn-outline">Agendar cita</a>
      <button
        class="menu-toggle"
        type="button"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-label="Abrir menú"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

@if (mobileMenuOpen()) {
  <div class="mobile-menu">
    <ul>
      <li><a href="#servicios" (click)="closeMobileMenu()">Servicios</a></li>
      <li><a href="#nosotros" (click)="closeMobileMenu()">Nosotros</a></li>
      <li><a href="#info" (click)="closeMobileMenu()">Horario</a></li>
      <li>
        <a
          [href]="whatsappUrl"
          target="_blank"
          rel="noopener"
          class="btn btn-solid"
          (click)="closeMobileMenu()"
        >Agendar cita</a>
      </li>
    </ul>
  </div>
}
