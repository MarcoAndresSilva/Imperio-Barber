services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: imperio
      POSTGRES_PASSWORD: imperio_dev
      POSTGRES_DB: imperio_barber
    ports:
      - "5433:5432"
    volumes:
      - imperio_barber_db_data:/var/lib/postgresql/data

volumes:
  imperio_barber_db_data:
